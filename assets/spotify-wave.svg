<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Spotify cyberpunk audio visualizer</title>
  <desc id="description">Decorative neon equalizer animation. This visualizer does not display live Spotify playback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="640" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0221" />
      <stop offset="1" stop-color="#190b30" />
    </linearGradient>
    <linearGradient id="neon" x1="337" y1="0" x2="595" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f0ff" />
      <stop offset="0.55" stop-color="#bd71ff" />
      <stop offset="1" stop-color="#ff0055" />
    </linearGradient>
  </defs>
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: equalize 1.3s ease-in-out infinite alternate;
    }
    .bar:nth-child(3n) { animation-duration: 0.9s; animation-delay: -0.4s; }
    .bar:nth-child(3n + 1) { animation-duration: 1.1s; animation-delay: -0.8s; }
    .bar:nth-child(4n) { animation-delay: -0.6s; }
    @keyframes equalize {
      0% { transform: scaleY(0.25); }
      40% { transform: scaleY(0.8); }
      70% { transform: scaleY(0.45); }
      100% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="639" height="179" rx="12" fill="url(#background)" stroke="#ff0055" />
  <path d="M24 49H616M24 143H616" stroke="#392044" />
  <g transform="translate(26 20)" stroke="#1ed760" stroke-linecap="round">
    <circle cx="10" cy="10" r="10" fill="#1ed760" stroke="none" />
    <path d="M4.5 7.5C8 5.9 12.7 6.2 16 8" stroke="#0d0221" stroke-width="1.8" />
    <path d="M5.5 10.9C8.5 9.6 12 9.9 14.8 11.4" stroke="#0d0221" stroke-width="1.6" />
    <path d="M6.2 14C8.5 13.1 11.1 13.3 13.5 14.5" stroke="#0d0221" stroke-width="1.5" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="58" y="34" fill="#1ed760" font-size="13" font-weight="700" letter-spacing="2">SPOTIFY</text>
    <text x="616" y="33" fill="#b9a7cb" font-size="10" text-anchor="end" letter-spacing="1">AUDIO VISUALIZER</text>
    <text x="26" y="89" fill="#f2eafb" font-size="19" font-weight="700">CODE. COMMIT.</text>
    <text x="26" y="116" fill="#00f0ff" font-size="19" font-weight="700">REPEAT.</text>
    <text x="26" y="163" fill="#b9a7cb" font-size="10" letter-spacing="1">CYBER FREQUENCY // FOCUS MODE</text>
    <text x="616" y="163" fill="#00f0ff" font-size="10" text-anchor="end" letter-spacing="1">DECORATIVE LOOP</text>
  </g>
  <g fill="url(#neon)">
    <rect class="bar" x="337" y="104" width="10" height="24" rx="3" />
    <rect class="bar" x="354" y="90" width="10" height="38" rx="3" />
    <rect class="bar" x="371" y="76" width="10" height="52" rx="3" />
    <rect class="bar" x="388" y="95" width="10" height="33" rx="3" />
    <rect class="bar" x="405" y="70" width="10" height="58" rx="3" />
    <rect class="bar" x="422" y="84" width="10" height="44" rx="3" />
    <rect class="bar" x="439" y="63" width="10" height="65" rx="3" />
    <rect class="bar" x="456" y="80" width="10" height="48" rx="3" />
    <rect class="bar" x="473" y="98" width="10" height="30" rx="3" />
    <rect class="bar" x="490" y="72" width="10" height="56" rx="3" />
    <rect class="bar" x="507" y="87" width="10" height="41" rx="3" />
    <rect class="bar" x="524" y="66" width="10" height="62" rx="3" />
    <rect class="bar" x="541" y="82" width="10" height="46" rx="3" />
    <rect class="bar" x="558" y="96" width="10" height="32" rx="3" />
    <rect class="bar" x="575" y="106" width="10" height="22" rx="3" />
    <rect class="bar" x="592" y="114" width="10" height="14" rx="3" />
  </g>
</svg>
