name: Update Cyberpunk Profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - README.md
  schedule:
    - cron: "17 0 * * *" # 每天台灣時間 08:17 排程更新
  workflow_dispatch:

# 避免手動執行與排程同時寫入 output 分支。
concurrency:
  group: cyberpunk-profile-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate cyberpunk contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff0055&color_dots=#ebedf0,#e6c9ed,#be75ba,#00a3ad,#a38a00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff0055&color_dots=#161b22,#3b0d36,#800040,#00f0ff,#fcee09

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=false&bg_color=0d0221&title_color=00f0ff&text_color=e0d7ef&icon_color=ff0055&border_color=ff0055&border_radius=12&custom_title=LUCIEN%20%2F%2F%20GITHUB%20STATS&card_width=480
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=false&bg_color=0d0221&title_color=00f0ff&text_color=e0d7ef&border_color=ff0055&border_radius=12&custom_title=CODE%20%2F%2F%20LANGUAGES&card_width=360
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Publish generated SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore: update cyberpunk profile assets"
